name: HunterGram checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LOGGER_BOT_TOKEN: '000000:CI_TEST_ONLY'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile deleted_message_logger_bot.py huntergram_commands.py selftest.py
      - run: python selftest.py
